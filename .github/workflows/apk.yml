name: APK de prueba

# Se ejecuta con cada cambio en main y también a mano (Actions → APK de prueba → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Preparar el proyecto Android
        run: bash scripts/preparar.sh

      - name: Compilar la APK de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: rumbaluz-apk-de-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
