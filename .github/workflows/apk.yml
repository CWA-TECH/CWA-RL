name: APK de prueba

# Se ejecuta con cada cambio en main y también a mano (Actions → APK de prueba → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Si algo falla, las últimas líneas del registro salen como aviso en la ejecución (se ven sin descargar nada).
      - name: Preparar el proyecto Android
        run: |
          set -o pipefail
          bash scripts/preparar.sh 2>&1 | tee preparar.log || { echo "::error title=Preparar falló::$(tail -40 preparar.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Compilar la APK de prueba
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log || { echo "::error title=Gradle falló::$(grep -E 'error|Error|FAILURE|What went wrong|>' ../gradle.log | tail -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }

      - name: Datos de la compilación
        if: success()
        run: |
          V=$(node -p "Object.entries(require('./package.json').dependencies||{}).map(([k,v])=>k+' '+v).join(' · ')")
          echo "::notice title=Versiones::$V"
          echo "::notice title=APK::$(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"

      # Si falla, deja los registros en la rama «registros» para poder leerlos sin entrar en GitHub.
      - name: Guardar registros si falla
        if: failure()
        run: |
          mkdir -p /tmp/reg && cp -f preparar.log gradle.log /tmp/reg/ 2>/dev/null || true
          cd /tmp/reg && git init -q && git checkout -q -b registros
          git -c user.name=ci -c user.email=ci@localhost add -A && git -c user.name=ci -c user.email=ci@localhost commit -q -m "Registros de la ejecución ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" registros

      - name: Guardar la APK
        uses: actions/upload-artifact@v4
        with:
          name: rumbaluz-apk-de-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
